[project]
name = "proteingym-models-s3f"
version = "0.1.0"
description = "s3f model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    # newest torch that PyG publishes both torch_scatter and torch_cluster wheels for
    "torch==2.11.0",
    # compiled PyG extensions (from data.pyg.org, see find-links): torchdrug
    # hard-imports both; S3F/torchdrug use knn_graph/radius_graph
    "torch-scatter==2.1.2+pt211cu130",
    "torch-cluster==1.6.3+pt211cu130",
    "torch_geometric",
    # torchdrug's rdkit-pypi requirement has no py3.12 wheels; overridden to rdkit below
    "torchdrug==0.2.1",
    # torchdrug imports rdkit.Chem.Draw.mplCanvas (removed in rdkit 2024.03)
    "rdkit==2023.9.6",
    "fair-esm==2.0.0",
    # surface generation (s3f/surface.py, from dMaSIF); KeOps JIT-compiles with g++
    "pykeops==2.3",
    "robust_laplacian",
    "biopython",
    "biotite",
    "scipy",
    "scikit-learn",
    "pandas",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# proteingym-base 0.2.0 and evedesign 0.0.8 require biotite>=2.0, which
# requires numpy>=2.1. That overrides this stack's upstream numpy<2 pins.
# Ceiling: numba (an evedesign dependency) refuses NumPy > 2.4.
override-dependencies = ["numpy>=2.1,<2.5", "rdkit-pypi; python_version < '0'"]
find-links = ["https://data.pyg.org/whl/torch-2.11.0+cu130.html"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
