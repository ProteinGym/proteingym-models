[project]
name = "proteingym-models-prott5"
version = "0.1.0"
description = "ProtT5 embeddings + regressor (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    "torch",
    # transformers 5 misdetects ProtT5's sentencepiece vocab as a tiktoken file
    # and raises "`tiktoken` is required"; T5Tokenizer only loads under 4.x
    "transformers>=4.46,<5",
    # T5Tokenizer is sentencepiece-backed
    "sentencepiece",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
