[project]
name = "proteingym-models-esm1b"
version = "0.1.0"
description = "ESM-1b model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[esm2,proteingym]==0.0.8",
]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]

[tool.uv]
# no Python source of its own: the runner ships in evedesign
package = false
