[project]
name = "proteingym-models-onexi-genesis"
version = "0.1.0"
description = "ONE XI Genesis zero-shot biophysical and context-conditioned mutation scorer (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    "biopython",
    "pandas",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
