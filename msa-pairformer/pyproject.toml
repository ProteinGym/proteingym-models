[project]
name = "proteingym-models-msa-pairformer"
version = "0.1.0"
description = "msa-pairformer model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    "msa-pairformer==1.0.2",
    # imported by MSA_Pairformer.model but not declared by msa-pairformer
    "huggingface_hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]

[tool.uv]
# proteingym-base 0.2.0 and evedesign 0.0.8 require biotite>=2.0, which
# requires numpy>=2.1. That overrides this stack's upstream numpy<2 pins.
# Ceiling: numba (an evedesign dependency) refuses NumPy > 2.4.
override-dependencies = ["numpy>=2.1,<2.5"]
