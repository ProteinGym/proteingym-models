[project]
name = "proteingym-models-saprot"
version = "0.1.0"
description = "saprot model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    # build() asserts the MLM decoder is tied to / loaded alongside the word embeddings
    "transformers>=4.46,<5",
    "torch",
    # writing the target chain to a temporary PDB file for foldseek
    "biotite",
    "numpy",
    "pandas",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
