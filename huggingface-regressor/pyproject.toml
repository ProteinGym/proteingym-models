[project]
name = "proteingym.models.hfregressor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evedesign[proteingym]==0.0.8",
    "loguru>=0.7.3",
    "proteingym-base==0.2.0",
    "scikit-learn>=1.7.2",
    "torch>=2.8.0",
    "transformers==4.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
