[project]
name = "proteingym-models-esm-if1"
version = "0.1.0"
description = "ESM-IF1 model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    "torch",
    "fair-esm==2.0.0",
    "torch_geometric",
    "torch_scatter",
    "biotite",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch_scatter = { path = "vendor/torch_scatter_shim" }

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
