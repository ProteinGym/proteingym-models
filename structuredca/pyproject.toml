[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proteingym-models-structuredca"
version = "0.1.0"
description = "StructureDCA model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    "structuredca",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
