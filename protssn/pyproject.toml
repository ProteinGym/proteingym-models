[project]
name = "proteingym-models-protssn"
version = "0.1.0"
description = "protssn model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    # ESM-2 is a plain EsmModel path, so no transformers ceiling is needed;
    # the vendored upstream also imports transformers.activations.ACT2FN
    "transformers",
    "torch",
    # MessagePassing/Batch/BaseTransform for the vendored EGNN. PyG 2.x
    # aggregates without torch-scatter, so no shim is needed here
    "torch_geometric",
    # einops layers inside the vendored egnn_pytorch_geometric
    "einops",
    # PDBParser and ShrakeRupley (per-residue SASA is a node feature)
    "biopython",
    # the wrapper serializes the target chain to PDB in memory
    "biotite",
    "tqdm",
    "pandas",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
