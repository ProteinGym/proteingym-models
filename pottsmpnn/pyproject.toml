[project]
name = "proteingym-models-pottsmpnn"
version = "0.1.0"
description = "pottsmpnn model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    # upstream env.yaml pins torch 2.2.1 (cuda 12.1); the model is plain
    # PyTorch, so current torch is used
    "torch",
    "numpy",
    "pandas",
    # imported at module level by the vendored run_utils.py (plotting helpers)
    "matplotlib",
    "seaborn",
    "omegaconf",
    "biopython",
    "biotite",
    "tqdm",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = ["pytest~=8.4.1"]
