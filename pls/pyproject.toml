[project]
name = "proteingym-models-pls"
version = "0.1.0"
description = "PLS model submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy~=2.2.5",
    "scikit-learn~=1.7.0",
    "proteingym-base==0.2.0",
    "requests",
    "evedesign[proteingym]==0.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
