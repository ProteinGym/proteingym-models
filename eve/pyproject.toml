[project]
name = "proteingym-models-eve"
version = "0.1.0"
description = "EVE model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    # 0.0.6 is the first evedesign release that includes the EVE wrapper
    "evedesign[eve,proteingym]==0.0.8",
]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]

[tool.uv]
# no Python source of its own: the runner ships in evedesign
package = false
