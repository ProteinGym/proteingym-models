[project]
name = "proteingym-models-esmc"
version = "0.1.0"
description = "esmc model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    # model.py subclasses evedesign.models.esm2.ESM2; the [esm2] extra pulls in
    # torch + transformers
    "evedesign[esm2,proteingym]==0.0.8",
    # first release with native ESMC support
    "transformers>=5.19.0",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
