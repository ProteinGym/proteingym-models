[project]
name = "proteingym-models-progen2"
version = "0.1.0"
description = "ProGen2 model (evedesign-wrapped) submitted to ProteinGym"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "proteingym-base==0.2.0",
    "evedesign[proteingym]==0.0.8",
    "torch",
    # the vendored 2022 modeling code subclasses PreTrainedModel; transformers 5
    # removed APIs it relies on (the community mirror had to add GenerationMixin
    # to make it load there)
    "transformers>=4.40,<5",
    # upstream tokenizes with tokenizers.Tokenizer directly, not AutoTokenizer
    "tokenizers",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteingym"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest~=8.4.1",
]
